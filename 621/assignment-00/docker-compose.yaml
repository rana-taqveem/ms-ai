services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mlops_sqlsrv2025

    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=admin@12345
      - MSSQL_PID=Developer
      - MSSQL_TCP_PORT=1433
    ports:
      - "1433:1433"
    volumes:
      - primary_data:/var/opt/mssql

volumes:
  primary_data:
